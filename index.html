<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <title>Mon Potager Sol Vivant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌱 Mon Potager Sol Vivant</h1>
    <p class="subtitle">Nourrir le sol, augmenter la matière organique et économiser l'eau</p>
  </header>

  <div id="region-selector">
    <label for="departement">📍 Mon département :</label>
    <select id="departement"></select>
    <label for="region" class="region-label">Zone :</label>
    <select id="region">
      <option value="oceanique">Océanique (Bretagne, Normandie, Aquitaine…)</option>
      <option value="continental">Continental (Alsace, Bourgogne, Île-de-France…)</option>
      <option value="mediterraneen">Méditerranéen (PACA, Languedoc, Corse…)</option>
      <option value="montagne">Montagne (Alpes, Pyrénées, Massif Central…)</option>
    </select>
  </div>

  <nav id="tabs">
    <button class="tab-btn active" data-tab="calendrier">📅 Calendrier</button>
    <button class="tab-btn" data-tab="planches">🌾 Mes Planches</button>
    <button class="tab-btn" data-tab="sources">📚 Sources</button>
  </nav>

  <!-- TAB CALENDRIER -->
  <section id="tab-calendrier">
    <nav id="month-nav">
      <button class="month-btn active" data-month="0">Jan</button>
      <button class="month-btn" data-month="1">Fév</button>
      <button class="month-btn" data-month="2">Mar</button>
      <button class="month-btn" data-month="3">Avr</button>
      <button class="month-btn" data-month="4">Mai</button>
      <button class="month-btn" data-month="5">Juin</button>
      <button class="month-btn" data-month="6">Juil</button>
      <button class="month-btn" data-month="7">Aoû</button>
      <button class="month-btn" data-month="8">Sep</button>
      <button class="month-btn" data-month="9">Oct</button>
      <button class="month-btn" data-month="10">Nov</button>
      <button class="month-btn" data-month="11">Déc</button>
    </nav>
    <div id="filters">
      <button class="filter-btn active" data-filter="all">Tout</button>
      <button class="filter-btn" data-filter="couverture">🍂 Couverture</button>
      <button class="filter-btn" data-filter="matiere-organique">♻️ Matière organique</button>
      <button class="filter-btn" data-filter="engrais-verts">🌾 Engrais verts</button>
      <button class="filter-btn" data-filter="bachage">🟤 Bâchage</button>
      <button class="filter-btn" data-filter="eau">💧 Eau</button>
      <button class="filter-btn" data-filter="observation">🔎 Observation</button>
    </div>
    <main id="plant-list"></main>
  </section>

  <!-- TAB SOURCES -->
  <section id="tab-sources" class="hidden">
    <div id="sources-list"></div>
  </section>

  <!-- TAB PLANCHES -->
  <section id="tab-planches" class="hidden">
    <div id="planches-list"></div>
    <button id="btn-show-form" class="btn-add-planche" onclick="showPlancheForm()">➕ Ajouter une planche</button>

    <div id="planche-form" class="hidden">
      <h2 id="form-title">➕ Nouvelle planche</h2>

      <div class="form-step">
        <div class="step-label">1. Nom & dimensions</div>
        <div class="form-row">
          <input type="text" id="planche-nom" placeholder="Nom (ex: Planche A)">
        </div>
        <div class="form-row">
          <label>Longueur <span class="unit">m</span></label>
          <input type="number" id="planche-longueur" min="0.5" step="0.1" value="3">
          <label>Largeur <span class="unit">m</span></label>
          <input type="number" id="planche-largeur" min="0.3" step="0.1" value="1.2">
        </div>
      </div>

      <div class="form-step">
        <div class="step-label">2. Ensoleillement</div>
        <div class="form-row">
          <label>Orientation :</label>
          <select id="planche-orientation">
            <option value="journee">☀️ Soleil toute la journée</option>
            <option value="matin">🌅 Soleil le matin seulement</option>
            <option value="apres-midi">🌇 Soleil l'après-midi seulement</option>
          </select>
        </div>
        <div class="form-row soleil-row">
          <div class="soleil-input">
            <label>🌅 Matin <span class="unit">(6h-12h)</span></label>
            <input type="range" id="planche-hmatin" min="0" max="6" value="4">
            <span id="hmatin-val">4h</span>
          </div>
          <div class="soleil-input">
            <label>🌇 Après-midi <span class="unit">(12h-18h)</span></label>
            <input type="range" id="planche-haprem" min="0" max="6" value="3">
            <span id="haprem-val">3h</span>
          </div>
        </div>
      </div>

      <div class="form-step">
        <div class="step-label">3. Type de sol & culture précédente</div>
        <div class="form-row">
          <label>Sol :</label>
          <select id="planche-sol">
            <option value="limoneux">🌾 Limoneux (fertile, facile)</option>
            <option value="argileux">🧱 Argileux (lourd, retient l'eau)</option>
            <option value="sableux">🏖️ Sableux (léger, drainant)</option>
            <option value="calcaire">⚪ Calcaire (alcalin, clair)</option>
            <option value="humifere">🍂 Humifère (riche, foncé)</option>
          </select>
        </div>
        <div class="form-row">
          <label>Avant :</label>
          <select id="planche-precedent">
            <option value="">Aucune / ne sais pas</option>
            <option value="Solanacées">🍅 Solanacées (tomate, PDT, poivron...)</option>
            <option value="Cucurbitacées">🥒 Cucurbitacées (courgette, courge...)</option>
            <option value="Fabacées">🫘 Fabacées (haricot, pois...)</option>
            <option value="Brassicacées">🥦 Brassicacées (chou, radis...)</option>
            <option value="Alliacées">🧅 Alliacées (oignon, ail, poireau...)</option>
            <option value="Apiacées">🥕 Apiacées (carotte, persil...)</option>
            <option value="Astéracées">🥬 Astéracées (laitue...)</option>
            <option value="Chénopodiacées">🟣 Chénopodiacées (épinard, betterave...)</option>
            <option value="engrais-vert">🌾 Engrais vert (moutarde, phacélie...)</option>
            <option value="rien">💤 Repos / jachère</option>
          </select>
        </div>
      </div>

      <div class="form-step">
        <div class="step-label">4. Choisir les plantes et nombre de rangs</div>
        <div id="legume-picker"></div>
        <div id="variete-picker" class="hidden"></div>
        <div id="rang-picker" class="hidden"></div>
        <div id="plantes-selectionnees"></div>
      </div>

      <button id="btn-add-planche" class="btn-primary">Créer la planche</button>
      <button id="btn-cancel-edit" class="btn-cancel" onclick="hidePlancheForm()">Annuler</button>
    </div>
  </section>

  <script src="legumes/tomate.js"></script>
  <script src="legumes/carotte.js"></script>
  <script src="legumes/laitue.js"></script>
  <script src="legumes/courgette.js"></script>
  <script src="legumes/radis.js"></script>
  <script src="legumes/haricot.js"></script>
  <script src="legumes/poivron_aubergine.js"></script>
  <script src="legumes/epinard.js"></script>
  <script src="legumes/petit_pois.js"></script>
  <script src="legumes/alliacees.js"></script>
  <script src="legumes/chou.js"></script>
  <script src="legumes/cucurbitacees.js"></script>
  <script src="legumes/autres.js"></script>
  <script src="legumes/pomme_de_terre.js"></script>
  <script src="data.js"></script>
  <script src="calendrier.js"></script>
  <script src="planches.js"></script>
  <script src="sources.js"></script>
  <script src="app.js"></script>
</body>
</html>
